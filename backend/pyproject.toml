[project]
name = "sysmho-hunter-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "joblib>=1.4",
    "numpy>=1.26",
    "passlib[argon2,bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "qdrant-client>=1.18.0",
    "rich>=13.0",
    "scikit-learn>=1.5",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Buscar tests en ../tests/ con el paquete app accesible
testpaths = ["../tests"]
pythonpath = ["."]  # agrega backend/ al sys.path para que 'app' sea importable

[tool.ruff]
line-length = 79
target-version = "py312"
# Migraciones son auto-generadas por Alembic — no se verifican
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# F821: SQLAlchemy cross-model — forward references en archivos distintos
"app/models/*.py" = ["F821"]
# tool_explanations.py es archivo de datos con texto humano (E501 ok)
"app/recon/tool_explanations.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
